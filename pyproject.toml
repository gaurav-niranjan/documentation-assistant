[project]
name = "chat-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gaurav-niranjan", email = "65671046+gaurav-niranjan@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "docling>=2.124.0",
    "google-genai>=2.22.0",
    "ipykernel>=7.3.0",
    "ipython>=8.39.0",
    "openai>=3.7.0",
    "pinecone>=9.1.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
chat-app = "chat_app:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
